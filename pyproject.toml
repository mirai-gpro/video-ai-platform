[project]
name = "video-ai-platform"
version = "0.1.0"
description = "Model-agnostic, modular video generation platform (OmniAvatar 1.3B and beyond)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Core, GPU-free dependencies. Heavy ML/CUDA dependencies are intentionally
# kept out of the base set and pulled in via the `gpu` extra during Phase 1,
# so the design-phase scaffold installs and tests on CPU-only machines/CI.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-json-logger>=2.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Installed in the GPU containers (RunPod RTX 4090 / L40S). Pinned for real
# during Phase 1 against OmniAvatar 1.3B's requirements (PyTorch 2.4.0,
# torchvision 0.19.0, torchaudio 2.4.0; optional flash-attn; Wav2Vec2).
gpu = [
    # "torch==2.4.0",       # CUDA 12.x build, pinned in docker/ at Phase 1
    # "torchvision==0.19.0",
    # "torchaudio==2.4.0",
    # "transformers",        # Wav2Vec2 audio encoder
    # "diffusers",
    # "flash-attn",          # optional acceleration
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
vap = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["providers", "pipeline", "api", "cli", "benchmarks", "config"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) in argument defaults is the idiomatic Typer pattern.
"cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
