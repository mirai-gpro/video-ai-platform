# Default configuration for the Video AI Platform.
# Override per-environment with a *.local.yaml (git-ignored) or env vars.

default_provider: omniavatar
output_dir: outputs

server:
  host: 0.0.0.0
  port: 8000

benchmark:
  enabled: true
  output_dir: benchmarks/runs

# Per-provider options. These are passed into the Provider untouched; the
# shared layers never interpret them. Real values are filled in at Phase 1.
#
# Active scope: OmniAvatar 1.3B only. Other models (e.g. MultiTalk for
# multi-person dialogue) are deferred (ADR-0004); add their options here when
# reintroduced. Values are passed into the Provider untouched.
providers:
  options:
    omniavatar:
      # weights_path: /workspace/weights/OmniAvatar-1.3B
      # config: configs/inference_1.3B.yaml
      # num_steps: 25            # 20-50
      # guidance_scale: 4.5
      # audio_scale: 3.0
      # dtype: bfloat16
      # cpu_offload: false       # enable to fit the 24GB RTX 4090 if needed
      # flash_attn: true
      {}
