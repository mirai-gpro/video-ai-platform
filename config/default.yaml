# Default configuration for the Video AI Platform.
# Override per-environment with a *.local.yaml (git-ignored) or env vars.

default_provider: skyreels
output_dir: outputs

server:
  host: 0.0.0.0
  port: 8000

benchmark:
  enabled: true
  output_dir: benchmarks/runs

# Per-provider options. These are passed into the Provider untouched; the
# shared layers never interpret them. Real values are filled in at Phase 1.
#
# Active scope: SkyReels V3 only. MultiTalk is deferred to a future phase
# (ADR-0004); add its options block here when it is reintroduced.
providers:
  options:
    skyreels:
      # weights_path: /workspace/weights/SkyReels-V3
      # dtype: bfloat16
      # attention: flash      # flash | sage | sdpa
      # cpu_offload: false
      {}
